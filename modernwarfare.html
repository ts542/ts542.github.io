<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Warfarer DS Emulator</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #000;
    }
    #game {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <div id="game"></div>

  <script>
    // EmulatorJS configuration
    EJS_player = '#game';
    EJS_core = 'nds';

    // BIOS file (raw GitHub URL)
    EJS_biosUrl = 'https://raw.githubusercontent.com/ts542/ts542/main/nds/bios.zip';

    // ROM parts (raw GitHub URLs)
    EJS_gameUrl = [
      'https://raw.githubusercontent.com/ts542/ts542/main/nds/mwm_part_aa',
      'https://raw.githubusercontent.com/ts542/ts542/main/nds/mwm_part_ab',
      'https://raw.githubusercontent.com/ts542/ts542/main/nds/mwm_part_ac',
      'https://raw.githubusercontent.com/ts542/ts542/main/nds/mwm_part_ad',
      // Add more parts here if needed
    ];
  </script>

  <!-- Load EmulatorJS -->
  <script src="https://cdn.emulatorjs.org/latest/loader.js"></script>
</body>
</html>
