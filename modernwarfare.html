
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Warfare DS Emulator</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #000;
    }
    #game {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <div id="game"></div>

  <script>
    // EmulatorJS config
    EJS_player = '#game';
    EJS_core = 'nds';
    EJS_biosUrl = 'https://ts542.github.io/nds/bios.zip';

    // ROM parts URLs (replace with your GitHub raw URLs for split parts)
    EJS_gameUrl = [
      'https://ts542.github.io/mwm_part_aa',
      'https://ts542.github.io/mwm_part_ab',
      'https://ts542.github.io/mwm_part_ac',
      'https://ts542.github.io/mwm_part_ad',
      // add more parts if needed
    ];
  </script>

  <!-- Load EmulatorJS from CDN -->
  <script src="https://cdn.emulatorjs.org/latest/loader.js"></script>
</body>
</html>
