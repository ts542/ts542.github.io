<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Classroom</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #000;
    }
    #game {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>

<body>
  <div id="game"></div>

  <script>
    // REQUIRED: div ID
    EJS_player = '#game';

    // Use official CDN for core data (fixes most blank screens)
    EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";

    // NDS core
    EJS_core = 'nds';

    // ROM
    EJS_gameUrl = "https://archive.org/download/call-of-duty-modern-warfare-mobilized/Call_of_Duty_Mobil_Warfare_Mobilized.nds";

    // BIOS zip from YOUR repo
    EJS_biosUrl = "https://raw.githubusercontent.com/ts542/ts542/main/ds/bios.zip";
  </script>

  <!-- official loader -->
  <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
