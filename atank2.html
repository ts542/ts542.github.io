<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Google Classroom</title>
    <link rel="icon" href="gc.svg" type="image/svg">

    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      .embed-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      embed {
        max-width: 100%;
        max-height: 100%;
        aspect-ratio: 550 / 400;
        border: none;
        display: block;
      }

      /* Fullscreen Button */
      #fullscreen-btn {
        position: fixed;
        top: 15px;
        right: 15px;
        padding: 10px 14px;
        background: rgba(255,255,255,0.15);
        border: 2px solid #fff;
        border-radius: 6px;
        color: white;
        font-size: 18px;
        cursor: pointer;
        z-index: 9999;
        backdrop-filter: blur(4px);
        user-select: none;
      }

      #fullscreen-btn:hover {
        background: rgba(255,255,255,0.3);
      }
    </style>
  </head>

  <body>
    <script src="/ruffle/ruffle.js"></script>

    <button id="fullscreen-btn">⛶</button>

    <div class="embed-container" id="embed-wrapper">
      <embed src="tanks2.swf"></embed>
    </div>

    <script>
      const btn = document.getElementById("fullscreen-btn");
      const embedWrapper = document.getElementById("embed-wrapper");

      btn.addEventListener("click", () => {
        if (!document.fullscreenElement) {
          embedWrapper.requestFullscreen();
        } else {
          document.exitFullscreen();
        }
      });
    </script>
    <p>For Fullscreen, Right click and press Fullscreen></p>

  </body>
</html>
